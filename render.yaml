services:
  - type: web
    name: attendiq-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROJECT_NAME
        value: ATTENDIQ Enterprise
      - key: SECRET_KEY
        value: attendiq_jwt_secret_key_prod_998877665544332211
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DUPLICATE_PUNCH_COOLDOWN_SECONDS
        value: "300"
